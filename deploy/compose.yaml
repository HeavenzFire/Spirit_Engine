services:
  metadata-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: heavenzfire_recovery
      POSTGRES_USER: hf_recovery
      POSTGRES_PASSWORD: ${HF_DB_PASSWORD:?Set HF_DB_PASSWORD in the host environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recovery_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hf_recovery -d heavenzfire_recovery"]
      interval: 10s
      timeout: 3s
      retries: 5

  object-store:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HF_OBJECT_USER:?Set HF_OBJECT_USER in the host environment}
      MINIO_ROOT_PASSWORD: ${HF_OBJECT_PASSWORD:?Set HF_OBJECT_PASSWORD in the host environment}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - recovery_objects:/data

volumes:
  recovery_db:
  recovery_objects:
